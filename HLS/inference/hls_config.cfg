part=xc7z020clg400-1

[hls]
flow_target=vivado
# Same rationale as the per-layer components: keep every MAC loop rolled so HLS
# shares one multiplier instead of unrolling into one-per-tap. Area is binding.
syn.compile.pipeline_loops=0
package.output.format=ip_catalog
package.output.syn=false
# Back to 12ns / 83 MHz, matching the per-layer components. The 20ns detour existed
# only because the FLOAT sigmoid's exp put the critical path at 0.01ns slack; with
# LATER_OPTIMIZATIONS #1 applied (fixed-point tanh, sigmoid via the 0.5+0.5*tanh(x/2)
# identity) those float cores are gone and the path should be far shorter.
clock=12ns
syn.top=inference_stream

# The top level plus all six layer DUTs compile into this one component. The
# per-layer components still build standalone from their own cfgs; these are the
# same source files, not copies.
syn.file=inference.cpp
syn.file=../conv1/conv1.cpp
syn.file=../Relu_Max_1/relu_max_1.cpp
syn.file=../conv2/conv2.cpp
syn.file=../Relu_Max_2/relu_max_2.cpp
syn.file=../LSTM/LSTM.cpp
syn.file=../linear/fc.cpp

tb.file=inference_TB.cpp
tb.file=./inference_goldens

# layer_dims.h and the generated footdrop_weights.h both live in HLS/header.
syn.cflags=-IC:/Users/cocol/Ruby_Proj/workspace/HLS/header
syn.csimflags=-IC:/Users/cocol/Ruby_Proj/workspace/HLS/header
tb.cflags=-IC:/Users/cocol/Ruby_Proj/workspace/HLS/header
